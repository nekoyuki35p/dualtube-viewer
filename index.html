<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>DualTube Viewer</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --panel2: #222;
      --text: #f5f5f5;
      --muted: #a9a9a9;
      --accent: #ff4f8b;
      --border: #333;
      --danger: #ff7070;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100%;
    }

    body {
      padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      margin: 8px 4px 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--panel2);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .load-btn {
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin: 6px 0 10px;
      border: 1px solid #202020;
    }

    .player-wrap iframe,
    .player-wrap > div {
      width: 100% !important;
      height: 100% !important;
    }

    .audio-controls {
      position: sticky;
      bottom: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px;
      margin-top: 10px;
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }

    .audio-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .status {
      min-height: 20px;
      margin: 4px 2px 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error {
      color: var(--danger);
    }

    .note {
      margin: 10px 4px 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (orientation: landscape) {
      .players {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .section {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>DualTube Viewer</h1>

    <div class="players">
      <section class="section">
        <div class="input-row">
          <input id="urlTop" type="url" inputmode="url"
                 placeholder="上のYouTube URL" autocomplete="off" />
          <button class="load-btn" id="loadTop">読込</button>
        </div>
        <div class="player-wrap">
          <div id="playerTop"></div>
        </div>
      </section>

      <section class="section">
        <div class="input-row">
          <input id="urlBottom" type="url" inputmode="url"
                 placeholder="下のYouTube URL" autocomplete="off" />
          <button class="load-btn" id="loadBottom">読込</button>
        </div>
        <div class="player-wrap">
          <div id="playerBottom"></div>
        </div>
      </section>
    </div>

    <div id="status" class="status">URLを2本入れて「読込」。その後、それぞれの ▶ を押して再生してください。</div>

    <div class="audio-controls">
      <button class="audio-btn" data-mode="top">🔊 上</button>
      <button class="audio-btn" data-mode="bottom">🔊 下</button>
      <button class="audio-btn" data-mode="both">🔊 両方</button>
    </div>

    <div class="note">
      初期状態は上下ともミュートです。音声ボタンは再生を止めずにミュート状態だけ切り替えます。
      YouTube側やブラウザ側の制約により、端末・動画によって同時再生の挙動が異なる場合があります。
    </div>
  </main>

  <script>
    let apiReady = false;
    let topPlayer = null;
    let bottomPlayer = null;

    function setStatus(message, isError = false) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.classList.toggle("error", isError);
    }

    function extractVideoId(value) {
      if (!value) return null;
      const raw = value.trim();

      if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;

      let url;
      try {
        url = new URL(raw);
      } catch {
        return null;
      }

      const host = url.hostname.replace(/^www\./, "");

      if (host === "youtu.be") {
        const id = url.pathname.split("/").filter(Boolean)[0];
        return /^[A-Za-z0-9_-]{11}$/.test(id || "") ? id : null;
      }

      if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
        const v = url.searchParams.get("v");
        if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return v;

        const parts = url.pathname.split("/").filter(Boolean);
        if (parts.length >= 2 && ["live", "shorts", "embed"].includes(parts[0])) {
          const id = parts[1];
          return /^[A-Za-z0-9_-]{11}$/.test(id || "") ? id : null;
        }
      }

      return null;
    }

    function makePlayer(elementId, readyCallback) {
      return new YT.Player(elementId, {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: {
          autoplay: 0,
          controls: 1,
          playsinline: 1,
          rel: 0,
          fs: 1
        },
        events: {
          onReady: (event) => {
            event.target.mute();
            readyCallback?.();
          },
          onError: (event) => {
            setStatus("YouTubeプレイヤーでエラーが発生しました。コード: " + event.data, true);
          }
        }
      });
    }

    window.onYouTubeIframeAPIReady = function() {
      apiReady = true;

      topPlayer = makePlayer("playerTop");
      bottomPlayer = makePlayer("playerBottom");

      setStatus("準備完了。URLを読み込んで、それぞれ手動で ▶ を押してください。");
    };

    function loadVideo(which) {
      if (!apiReady) {
        setStatus("YouTubeプレイヤーを準備中です。少ししてからもう一度押してください。", true);
        return;
      }

      const isTop = which === "top";
      const input = document.getElementById(isTop ? "urlTop" : "urlBottom");
      const player = isTop ? topPlayer : bottomPlayer;
      const id = extractVideoId(input.value);

      if (!id) {
        setStatus("YouTubeのURLを確認してください。", true);
        return;
      }

      try {
        player.cueVideoById(id);
        player.mute();
        setStatus((isTop ? "上" : "下") + "の動画を読み込みました。▶ を押して再生してください。");
      } catch (e) {
        setStatus("動画の読み込みに失敗しました。", true);
      }
    }

    function setAudioMode(mode) {
      if (!topPlayer || !bottomPlayer) {
        setStatus("プレイヤーを準備中です。", true);
        return;
      }

      try {
        if (mode === "top") {
          topPlayer.unMute();
          topPlayer.setVolume(100);
          bottomPlayer.mute();
        } else if (mode === "bottom") {
          topPlayer.mute();
          bottomPlayer.unMute();
          bottomPlayer.setVolume(100);
        } else {
          topPlayer.unMute();
          bottomPlayer.unMute();
          topPlayer.setVolume(100);
          bottomPlayer.setVolume(100);
        }

        document.querySelectorAll(".audio-btn").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });

        const label = mode === "top" ? "上" : mode === "bottom" ? "下" : "両方";
        setStatus("音声: " + label);
      } catch (e) {
        setStatus("音声切替に失敗しました。", true);
      }
    }

    document.getElementById("loadTop").addEventListener("click", () => loadVideo("top"));
    document.getElementById("loadBottom").addEventListener("click", () => loadVideo("bottom"));

    document.querySelectorAll(".audio-btn").forEach(btn => {
      btn.addEventListener("click", () => setAudioMode(btn.dataset.mode));
    });

    document.getElementById("urlTop").addEventListener("keydown", e => {
      if (e.key === "Enter") loadVideo("top");
    });

    document.getElementById("urlBottom").addEventListener("keydown", e => {
      if (e.key === "Enter") loadVideo("bottom");
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        try { topPlayer?.pauseVideo(); } catch {}
        try { bottomPlayer?.pauseVideo(); } catch {}
      }
    });
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
